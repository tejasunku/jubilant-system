# Shell Container - Persistent Ubuntu Shell for AI Agent
#
# Usage:
#   podman-compose -f ansible/shell-compose.yml up -d
#   ssh root@127.0.0.1 -p 2222
#
# Default password: hermes

services:
  shell:
    image: docker.io/linuxserver/openssh-server
    container_name: hermes-shell
    pull_policy: missing
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "America/Los_Angeles"
      PASSWORD_ACCESS: "true"
      USER_PASSWORD: "hermes"
      USER_NAME: "root"
    ports:
      - "127.0.0.1:2222:2222"
    restart: unless-stopped