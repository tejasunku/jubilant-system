# Shell Container - Persistent Ubuntu Shell for AI Agent
#
# Usage:
#   podman-compose -f ansible/shell-compose.yml up -d
#   podman exec -it hermes-shell /bin/bash
#
# SSH from host: ssh root@<container-ip>

services:
  shell:
    image: docker.io/library/ubuntu:latest
    container_name: hermes-shell
    pull_policy: missing
    command: ["/bin/bash", "-c", "trap 'exit 0' SIGINT SIGTERM; sleep infinity"]
    ports:
      - "127.0.0.1:2222:22"
    networks:
      - shell-net
    restart: unless-stopped

networks:
  shell-net:
    driver: bridge