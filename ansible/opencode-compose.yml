# OpenCode - AI Coding Agent
# https://opencode.ai/
#
# Usage:
#   1. Run: podman compose -f opencode-compose.yml up -d
#   2. Access: http://localhost:4096 (web UI)
#   3. Set password via OPENCODE_SERVER_PASSWORD in .env

services:
  opencode:
    image: docker.io/smanx/opencode:latest
    container_name: opencode
    pull_policy: always
    command: bash -c "apt-get update && apt-get install -y npm && opencode web --port 4096 --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:4096:4096"
    volumes:
      - /home/admin/opencode:/workspace
      - /home/admin/opencode/.config/opencode:/root/.config/opencode
      - /home/admin/opencode/.local/share/opencode:/root/.local/share/opencode
      - /home/admin/opencode/.local/state/opencode:/root/.local/state/opencode
      - /home/admin/opencode/.cache/opencode:/root/.cache/opencode
    environment:
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-opencode}
      - OPENCODE_SERVER_USERNAME=admin
      - HOME=/workspace
    restart: unless-stopped
    network_mode: host