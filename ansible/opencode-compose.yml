# OpenCode - AI Coding Agent
# https://opencode.ai/
#
# Usage:
#   1. Run: podman compose -f opencode-compose.yml up -d
#   2. Access: http://localhost:4096 (web UI)
#   3. Set password via OPENCODE_SERVER_PASSWORD in .env

services:
  opencode:
    image: smanx/opencode
    container_name: opencode
    pull_policy: always
    ports:
      - "127.0.0.1:4096:4096"
    volumes:
      - /home/admin/opencode:/workspace
      - opencode-config:/root/.config/opencode
      - opencode-data:/root/.local/share/opencode
    environment:
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-opencode}
      - OPENCODE_SERVER_USERNAME=admin
      - OPENCODE_HOSTNAME=0.0.0.0
      - HOME=/root
    restart: unless-stopped
    network_mode: host

volumes:
  opencode-config:
  opencode-data: