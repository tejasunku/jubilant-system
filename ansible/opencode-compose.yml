# OpenCode - AI Coding Agent
# https://opencode.ai/
#
# Usage:
#   1. Run: podman compose -f opencode-compose.yml up -d
#   2. Access: http://localhost:4096 (web UI)

services:
  opencode:
    image: localhost/opencode-custom:latest
    container_name: opencode
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4096:4096"
    volumes:
      # Workspace - agent's working directory
      - /home/admin/opencode:/workspace
      # Config - hot-reloadable, persists across rebuilds
      - /home/admin/.config/opencode:/workspace/.config/opencode:Z
      # Podman socket - allows agent to restart itself
      - /run/user/${UID:-1000}/podman/podman.sock:/run/podman/podman.sock:Z
      # Restart helper script
      - /home/admin/scripts:/opt/scripts:ro,Z
    environment:
      - HOME=/workspace
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      # Tell podman to use the mounted socket (acts as podman-remote)
      - CONTAINER_HOST=unix:///run/podman/podman.sock
    restart: unless-stopped
    network_mode: host