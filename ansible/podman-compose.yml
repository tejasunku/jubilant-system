# Hindsight - AI Memory System
# https://hindsight.vectorize.io/
#
# Usage:
#   1. Copy .env file with API keys to /opt/services/.env
#   2. Run: podman compose up -d
#   3. Access: http://localhost:8888 (API), http://localhost:9999 (Web UI)
#
# Environment variables are stored in /opt/services/.env
# Do NOT commit this file with actual API keys

# Hermes Agent - AI Agent with memory
# https://hermes-agent.nousresearch.com/docs/user-guide/docker/
#
# Usage:
#   1. Create ~/.hermes directory and run setup wizard on first start
#   2. Configure API keys in ~/.hermes/.env
#   3. Run: podman compose up -d
#   4. Access dashboard at http://localhost:9119 (when HERMES_DASHBOARD=1)

services:
    hindsight:
        image: ghcr.io/vectorize-io/hindsight:latest-slim
        container_name: hindsight
        pull_policy: always
        ports:
            - "8888:8888"
            - "9999:9999"
        env_file:
            - /opt/services/.env
        restart: unless-stopped

    hermes:
        image: docker.io/nousresearch/hermes-agent:latest
        container_name: hermes
        pull_policy: always
        command: gateway run
        ports:
            - "8642:8642"
            - "9119:9119"
        volumes:
            - ~/.hermes:/opt/data
        env_file:
            - /opt/services/.env
        environment:
            - HERMES_DASHBOARD=1
            - HERMES_DASHBOARD_TUI=1
            - API_SERVER_ENABLED=true
            - API_SERVER_HOST=127.0.0.1
        restart: unless-stopped
        deploy:
            limits:
                memory: 4G
                cpus: "2.0"
