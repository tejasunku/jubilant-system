---
# Cloudflare Tunnel setup for self-hosted services
- name: Configure Cloudflare Tunnel
  hosts: ubuntu_servers
  become: true
  vars:
    cloudflared_dir: "/home/{{ ansible_user }}/.cloudflared"

  tasks:
    - name: Find tunnel credentials file
      ansible.builtin.find:
        path: "{{ cloudflared_dir }}"
        pattern: "*.json"
        file_type: file
      register: creds_find

    - name: Fail if no tunnel exists
      ansible.builtin.fail:
        msg: "No tunnel found in {{ cloudflared_dir }}. Create one manually first: cloudflared tunnel create <name>"
      when: creds_find.matched == 0

    - name: Read tunnel credentials
      ansible.builtin.slurp:
        src: "{{ creds_find.files[0].path }}"
      register: creds_slurp

    - name: Parse tunnel credentials
      ansible.builtin.set_fact:
        credentials_file: "{{ creds_find.files[0].path }}"
        tunnel_info: "{{ creds_slurp.content | b64decode | from_json }}"
        tunnel_name: "{{ creds_slurp.content | b64decode | from_json | json_query('Name') }}"
        tunnel_id: "{{ creds_slurp.content | b64decode | from_json | json_query('ID') }}"

    - name: Load routes configuration
      ansible.builtin.set_fact:
        routes: "{{ lookup('ansible.builtin.file', playbook_dir + '/../cloudflared/routes.yml') | from_yaml }}"

    - name: Delete existing config if present
      ansible.builtin.file:
        path: "{{ cloudflared_dir }}/config.yml"
        state: absent
      ignore_errors: true

    - name: Generate cloudflared config
      ansible.builtin.template:
        src: cloudflared/config.yml.j2
        dest: "{{ cloudflared_dir }}/config.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Route DNS for each subdomain
      command:
        cmd: "cloudflared tunnel route dns {{ tunnel_name }} {{ item.hostname }}"
      loop: "{{ routes.routes }}"
      ignore_errors: true

    - name: Create systemd service for cloudflared tunnel
      ansible.builtin.copy:
        dest: /etc/systemd/system/cloudflared.service
        content: |
          [Unit]
          Description=Cloudflare Tunnel
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/cloudflared tunnel run --config {{ cloudflared_dir }}/config.yml
          Restart=on-failure
          RestartSec=5s
          User={{ ansible_user }}

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start cloudflared service
      ansible.builtin.systemd:
        name: cloudflared
        state: restarted
        enabled: true
        daemon_reload: true