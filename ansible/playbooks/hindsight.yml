---
# Hindsight setup playbook
#
# IMPORTANT: env_file changes (model, API keys, etc.) require container recreation,
# not just restart. This playbook does `down` + `up` to ensure fresh env.
# After initial setup, use: podman compose down && podman compose up -d
# to apply .env changes. `podman restart hindsight` won't pick up env changes.
- name: Setup Hindsight
  hosts: ubuntu_servers
  vars:
    repo_url: "https://github.com/tejasunku/jubilant-system.git"
    repo_dir: "/home/{{ ansible_user }}/jubilant-system"
    services_dir: "/opt/services"

  tasks:
    - name: Create services directory
      ansible.builtin.file:
        path: "{{ services_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy .env file to server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../.env"
        dest: "{{ services_dir }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Clone repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: main

    - name: Stop existing Hindsight container (if running)
      command:
        cmd: podman compose -f "{{ repo_dir }}/ansible/podman-compose.yml" down
      environment:
        HOME: "/home/{{ ansible_user }}"
      become: true
      become_user: "{{ ansible_user }}"
      ignore_errors: true

    - name: Pull and start Hindsight
      command:
        cmd: podman compose -f "{{ repo_dir }}/ansible/podman-compose.yml" up -d
      environment:
        HOME: "/home/{{ ansible_user }}"
      become: true
      become_user: "{{ ansible_user }}"

    - name: Create systemd user service for Hindsight
      ansible.builtin.copy:
        dest: "/home/{{ ansible_user }}/.config/systemd/user/hindsight.service"
        content: |
          [Unit]
          Description=Hindsight AI Memory System
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/podman compose -f /home/{{ ansible_user }}/jubilant-system/ansible/podman-compose.yml up
          ExecStop=/usr/bin/podman compose -f /home/{{ ansible_user }}/jubilant-system/ansible/podman-compose.yml down
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=default.target

    - name: Create systemd user wants directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.config/systemd/user/default.target.wants"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Enable Hindsight to start on boot
      ansible.builtin.file:
        src: "/home/{{ ansible_user }}/.config/systemd/user/hindsight.service"
        dest: "/home/{{ ansible_user }}/.config/systemd/user/default.target.wants/hindsight.service"
        state: link
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"