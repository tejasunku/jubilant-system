---
# OpenCode setup playbook
- name: Setup OpenCode
  hosts: ubuntu_servers
  vars:
    opencode_home: "/home/{{ ansible_user }}/opencode"
    opencode_config: "/home/{{ ansible_user }}/.config/opencode"
    scripts_dir: "/home/{{ ansible_user }}/scripts"

  tasks:
    - name: Enable lingering for user (allows systemd services at boot)
      ansible.builtin.shell:
        cmd: loginctl enable-linger {{ ansible_user }}
      become: true

    - name: Create OpenCode directory
      ansible.builtin.file:
        path: "{{ opencode_home }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Create OpenCode config directory (bind-mounted into container)
      ansible.builtin.file:
        path: "{{ opencode_config }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Create scripts directory
      ansible.builtin.file:
        path: "{{ scripts_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy restart-opencode helper script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/restart-opencode.sh"
        dest: "{{ scripts_dir }}/restart-opencode.sh"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy OpenCode compose file and Dockerfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../opencode-compose.yml"
        dest: "{{ opencode_home }}/opencode-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Copy OpenCode Dockerfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../opencode.Dockerfile"
        dest: "{{ opencode_home }}/Dockerfile"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Copy .env to OpenCode directory
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../.env"
        dest: "{{ opencode_home }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Create systemd user service for OpenCode
      ansible.builtin.copy:
        dest: "/home/{{ ansible_user }}/.config/systemd/user/opencode.service"
        content: |
          [Unit]
          Description=OpenCode AI Coding Agent
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/podman compose -f {{ opencode_home }}/opencode-compose.yml up -d --build
          Restart=on-failure
          RestartSec=5s
          Environment="HOME=/home/{{ ansible_user }}"
          User={{ ansible_user }}
          Group={{ ansible_user }}

          [Install]
          WantedBy=default.target

    - name: Create systemd user wants directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.config/systemd/user/default.target.wants"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Enable OpenCode to start on boot
      ansible.builtin.file:
        src: "/home/{{ ansible_user }}/.config/systemd/user/opencode.service"
        dest: "/home/{{ ansible_user }}/.config/systemd/user/default.target.wants/opencode.service"
        state: link
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Start OpenCode now
      ansible.builtin.shell:
        cmd: |
          cd {{ opencode_home }} && \
          podman compose -f opencode-compose.yml down || true && \
          podman compose -f opencode-compose.yml up -d --build
      become: true
      become_user: "{{ ansible_user }}"

    - name: Check OpenCode container status
      ansible.builtin.shell:
        cmd: podman ps | grep opencode || echo "not running"
      register: opencode_status
      changed_when: false