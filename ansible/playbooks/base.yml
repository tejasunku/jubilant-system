---
# Base playbook for Ubuntu server setup
- name: Base Ubuntu Server Configuration
  hosts: ubuntu_servers
  become: true
  vars:
      python_interpreter: /usr/bin/python3

  tasks:
      - name: Add Cloudflare repository
        ansible.builtin.shell:
            cmd: |
                mkdir -p --mode=0755 /usr/share/keyrings
                curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
                echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" > /etc/apt/sources.list.d/cloudflared.list
            creates: /etc/apt/sources.list.d/cloudflared.list

      - name: Add Podman repository
        ansible.builtin.shell:
            cmd: |
                . /etc/os-release
                echo "deb https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/stable/xUbuntu_${VERSION_ID}/ /" | tee /etc/apt/sources.list.d/devel:kubic:libcontainers:stable.list
                curl -fsSL https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/stable/xUbuntu_${VERSION_ID}/Release.key | gpg --dearmor -o /etc/apt/trusted.gpg.d/kubic.gpg
            creates: /etc/apt/sources.list.d/devel:kubic:libcontainers:stable.list

      - name: Add NodeSource repository
        ansible.builtin.shell:
            cmd: |
                apt-get install -y gnupg curl
                mkdir -p /etc/apt/keyrings
                curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
                echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
            creates: /etc/apt/sources.list.d/nodesource.list

      - name: Update apt cache
        ansible.builtin.apt:
            update_cache: yes
            cache_valid_time: 3600

      - name: Install common packages
        ansible.builtin.apt:
            name:
                - curl
                - wget
                - git
                - vim
                - htop
                - cloudflared
                - podman
                - podman-compose
                - nodejs
                - npm
            state: present

      - name: Symlink docker to podman
        ansible.builtin.file:
            src: /usr/bin/podman
            dest: /usr/local/bin/docker
            state: link
        become: true

      - name: Symlink docker-compose to podman-compose
        ansible.builtin.file:
            src: /usr/bin/podman-compose
            dest: /usr/local/bin/docker-compose
            state: link
        become: true

      - name: Create admin user
        ansible.builtin.user:
            name: admin
            groups: sudo
            append: yes
            shell: /bin/bash
        when: ansible_user != 'admin'

      - name: Enable linger for admin user (allows user services without login)
        ansible.builtin.shell:
            cmd: loginctl enable-linger admin
        become: true

      - name: Create systemd user directory for admin
        ansible.builtin.file:
            path: /home/{{ ansible_user }}/.config/systemd/user
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
            mode: '0755'
